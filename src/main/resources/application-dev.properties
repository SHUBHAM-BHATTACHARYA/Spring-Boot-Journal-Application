spring.application.name=journalApp

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=journaldb
#spring.data.mongodb.username=username
#spring.data.mongodb.password=password
spring.data.mongodb.auto-index-creation=true

logging.level.org.springframework.security=TRACE
#spring.security.user.name=shubham
#spring.security.user.password=1234

#dev port
server.port=8080

#we can customize the log from here
logging.level.com.shubham.application.journalApp.controller.JournalEntryController: INFO

# Base SMTP configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

# Under-the-hood JavaMail adjustments
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000