spring.application.name=journalApp
#dev port
server.port=8080

# --- MongoDB Configuration ---
# Modern versions favor using a complete URI over split host/port fields
spring.mongodb.uri=mongodb://localhost:27017/journaldb
spring.mongodb.auto-index-creation=true
#spring.mongodb.username=username
#spring.mongodb.password=password
spring.data.mongodb.auto-index-creation=true

# --- Security Configuration ---
logging.level.org.springframework.security=TRACE
#spring.security.user.name=shubham
#spring.security.user.password=1234



# --- Application Logging ---
logging.level.com.shubham.application.journalApp.controller.JournalEntryController: INFO

# --- Base SMTP Configuration ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

# --- JavaMail Adjustments ---
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000